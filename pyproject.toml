[project]
name = "maturl"
version = "1.0.0"
description = "Lab-maintained MatuRL fork for local deployment, customization, and evaluation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "antiberty>=1.0.0",
    "matplotlib>=3.11.2",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.1",
]

[project.optional-dependencies]
cu126 = [
    "torch>=2.7",
]
cu128 = [
    "torch>=2.7",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", extra = "cu126" },
    { index = "pytorch-cu128", extra = "cu128" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv]
conflicts = [
    [
        { extra = "cu126" },
        { extra = "cu128" },
    ],
]